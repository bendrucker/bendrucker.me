name = "bendrucker-me"
# The adapter's own default, wrapped so `Publish` can be exported alongside it.
main = "src/worker.ts"
compatibility_date = "2025-07-28"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
preview_urls = true

[cache]
enabled = true

[assets]
directory = "dist"
binding = "ASSETS"

[[routes]]
pattern = "www.bendrucker.me"
custom_domain = true

[[d1_databases]]
binding = "ACTIVITY_DB"
database_name = "bendrucker-activity"
database_id = "fea2c18d-3c27-4a2a-80be-8622fc4ebc59"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSION"

# Read-only in practice: the only route that touches it serves ride photos, and
# it rejects any key outside the photo prefix. The binding itself reaches every
# raw telemetry file in the bucket.
[[r2_buckets]]
binding = "RAW"
bucket_name = "activity-hub-raw"

# Resizes ride photos to the thumbnails the cards show. The zone's URL
# transformations are not enabled, so this binding is the only resizer.
[images]
binding = "IMAGES"

[observability]
enabled = true

[observability.traces]
enabled = true
