name: Cleanup

on:
  pull_request:
    types: [closed]

# deploy.yml's group, so a deploy still running for this pull request finishes
# before its resources go, and a queued one is cancelled instead of recreating them.
concurrency:
  group: pr-${{ github.event.number }}

permissions:
  contents: read
  deployments: write

jobs:
  previews:
    # deploy.yml's guard: a Dependabot pull request never had one.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "📦 Setup Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔧 Build shared packages"
        run: npm run build:packages

      - name: "🧹 Delete the previews and their database"
        run: npm run preview -- delete --name "pr-$PR"
        env:
          PR: ${{ github.event.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Deployments outlive the preview versions they point at, so a closed PR
      # leaves environments claiming to be live. Every worker in deploy.yml's
      # cloudflare matrix gets its own `pr-<number>-<worker>` environment.
      # Matching them by prefix rather than by name keeps this step from going
      # quietly stale the next time that matrix gains a worker.
      - name: "🧹 Mark PR deployments as inactive"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          set -uo pipefail
          ids=$(gh api --method GET "repos/$REPO/deployments" --paginate \
            --jq '.[] | select(.environment | startswith("pr-" + env.PR + "-")) | .id') || exit 1

          # One rejected status should not strand every deployment behind it,
          # so the step tries them all and reports the failure afterwards.
          status=0
          for id in $ids; do
            echo "Deactivating deployment $id"
            gh api --method POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent || status=1
          done
          exit $status
