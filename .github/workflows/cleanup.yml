name: Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Deployments outlive the preview versions they point at, so a closed PR
      # leaves environments claiming to be live. Every worker in deploy.yml's
      # cloudflare matrix gets its own `pr-<number>-<worker>` environment.
      # Matching them by prefix rather than by name keeps this step from going
      # quietly stale the next time that matrix gains a worker.
      - name: "🧹 Mark PR deployments as inactive"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          set -uo pipefail
          ids=$(gh api --method GET "repos/$REPO/deployments" --paginate \
            --jq '.[] | select(.environment | startswith("pr-" + env.PR + "-")) | .id') || exit 1

          # One rejected status should not strand every deployment behind it,
          # so the step tries them all and reports the failure afterwards.
          status=0
          for id in $ids; do
            echo "Deactivating deployment $id"
            gh api --method POST "repos/$REPO/deployments/$id/statuses" -f state=inactive --silent || status=1
          done
          exit $status
